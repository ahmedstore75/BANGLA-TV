name: Auto Generate JagoBD Playlist

on:
  schedule:
    - cron: '0 */6 * * *' # প্রতি ৬ ঘণ্টা পর পর স্বয়ংক্রিয়ভাবে আপডেট করবে
  workflow_dispatch: # গিটহাব থেকে ম্যানুয়ালি ক্লিক করে রান করার সুযোগ দেবে

jobs:
  build-and-save:
    runs-on: ubuntu-latest

    steps:
      # ১. রিপোজিটরি কোড চেকআউট করা
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ২. পাইথন এনভায়রনমেন্ট সেটআপ করা
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ৩. স্ক্র্যাপ করার জন্য প্রয়োজনীয় লাইব্রেরি ইনস্টল করা
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # ৪. পাইথন স্ক্রিপ্টটি রান করে ডাটা জেনারেট করা
      - name: Run Scraper Script
        run: python main.py

      # ৫. জেনারেট হওয়া ফাইল দুটি (.m3u এবং .json) গিটহাবে অটো সেভ/কমিক করা
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.json playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update JagoBD playlist and json data" && git push)
