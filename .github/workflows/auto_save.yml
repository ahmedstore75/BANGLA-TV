name: Auto Generate M3U and JSON Playlists

on:
  push:
    branches:
      - main  # আপনার মেইন ব্রাঞ্চের নাম অনুযায়ী পরিবর্তন করতে পারেন
  workflow_dispatch: # চাইলে ম্যানুয়ালি ক্লিক করেও রান করতে পারবেন

jobs:
  build-and-save:
    runs-on: ubuntu-latest

    steps:
      # ১. কোড চেকআউট
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ২. পাইথন সেটআপ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ৩. প্রয়োজনীয় লাইব্রেরি ইনস্টল
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      # ৪. পাইথন স্ক্রিপ্টটি রান করা
      - name: Run Script to Generate Playlists
        run: python main.py

      # ৫. তৈরি হওয়া ফাইল গিটহাবে অটোমেটিক কমিক/সেভ করা
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.json playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update playlist.m3u and playlist.json" && git push)
